    <div class="prose prose-base max-w-none text-gray-700 leading-relaxed">
      <p>布達佩斯是一個建築物很美的的城市。</p>
      <p>第一個覺得很有趣的是 匈牙利國會大廈。建築本身真的很浮誇，白天好看，晚上打燈之後更誇張，站在多瑙河旁邊會忍不住一直拍照，怎麼拍都像明信片。</p>
      <p>接著去了 布達城堡。城堡在山上，視野很好，整個城市看起來很安靜、很遼闊，但走上去的過程其實一點都不輕鬆。當下只覺得腿很痠，但現在回想起來，那個風景還是很值得。</p>
      <p>我也很喜歡 漁夫堡。白色的塔和拱門有一種童話感，站在那裡看城市，會短暫地忘記自己已經走了一整天。</p>
      <p>總之，布達佩斯真的很漂亮，但也真的在夏天非常熱。</p>
    </div>
  </section>
</div>
