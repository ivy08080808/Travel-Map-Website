    <div class="prose prose-base max-w-none text-gray-700 leading-relaxed mb-4">
      <p>會來 Colmar，其實很單純。</p>
      <p>就是因為看過 霍爾的移動城堡，一直對那種童話感的小鎮有一點嚮往，覺得如果現實中真的存在，應該會很溫柔。</p>
      <p>真正走進科爾馬的時候，發現它真的很漂亮。小鎮裡有很多很多送子鳥，站在屋頂上、煙囪旁，看起來一點也不突兀，反而像這裡本來就該有的風景。街上也到處都是葡萄乾麵包，看到的時候突然想到物理課上教過的東西，覺得有點好笑，也有點神奇。</p>
      <p>那天其實沒有做什麼特別的事，就是在小鎮裡走走、逛逛，慢慢把一天用完。沒有趕行程，也沒有一定要去哪裡，只是單純待在那裡。走到後來，心裡一直在想，如果有機會的話，希望冬天能再來一次，看看這個小鎮在另一個季節會是什麼樣子？</p>
    </div>
