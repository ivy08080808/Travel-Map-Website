<div class="space-y-10">
  <section class="space-y-4">
    <div class="prose prose-base max-w-none text-gray-700 leading-relaxed mb-4">
      <p>Tallinn 是一個很適合慢慢走的城市。</p>
      <p>街道不吵，空氣很冷，但很清醒。</p>
      <p>我去看了 Fat Margaret，厚厚的城牆讓人很有安全感，也很直接地提醒你這是一座很老的城市。</p>
      <p>接著看了很多教堂，其中印象最深的是 Alexander Nevsky Cathedral。圓頂、洋蔥型的屋頂、東正教的風格非常明顯，站在外面就很有存在感，裡面則安靜到會讓人不自覺放慢腳步。</p>
      <p>後來一路往上走，爬到了 Toompea Hill。</p>
      <p>站在高處往下看，可以看到整個城市的屋頂和遠方的海，那一刻會突然明白為什麼這座城市給人的感覺這麼穩、這麼慢。</p>
    </div>
  </section>
</div>
