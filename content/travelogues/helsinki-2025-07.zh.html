    <div class="prose prose-base max-w-none text-gray-700 leading-relaxed mb-4">
      <p>Helsinki 給我的感覺很乾淨，但有很多的觀光客，相較於波羅的海三小過。</p>
      <p>行程其實不多，因為只待了一下下。就是在首都裡隨意走走。</p>
      <p>去了 老農市場 和市場附近晃了一下，看各種食物和紀念品，很多關於鹿的，還有圖騰。</p>
      <p>也逛了幾個很有名的教堂，像是 赫爾辛基大教堂、烏斯別斯基大教堂，還有那座直接蓋在岩石裡的 岩石教堂。</p>
      <p>還去幫哥哥找了他最喜歡的Moomins專賣店，帶了一個小夜燈回去。</p>
      <p>這趟旅程裡也第一次吃了鹿肉，還有馴鹿肉。其中一種味道比較腥一點點，但還算可以接受，也算是一次滿特別的體驗。</p>
    </div>
  </section>
