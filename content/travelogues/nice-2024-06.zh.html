      <p>那天去海邊是陰天，但還是看到一整片藍中帶綠的海，石頭灘。大家坐在岸邊、躺著、發呆，好像都沒有什麼一定要去的地方。坐在岸上野餐，吃著超市裡便宜的法國麵包，好像快樂其實也不需要花多少價錢。</p>
      <p>那幾天沒有特別做什麼事，就是沿著海走，看浪打上岸，再退回去。時間在這裡好像變得比較軟，走到哪裡都不太想看手錶。</p>
      <p>Nice 不是那種會讓人驚呼連連的城市，但很適合什麼都不想的時候來。</p>
