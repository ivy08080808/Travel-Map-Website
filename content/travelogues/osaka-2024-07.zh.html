    <div class="prose prose-base max-w-none text-gray-700 leading-relaxed">
      <p>這是我第三次來 Osaka。</p>
      <p>一樣去了那些最有名的景點，熟悉的街道、熟悉的節奏，但這一次不一樣，因為是跟好朋友一起來。</p>
      <p>印象最深的是某天晚上跑去超市，買了和牛回住的地方自己煎。沒有特別研究怎麼煮，只記得油很香、肉很好吃，吃完之後整個人都很滿足。</p>
      <p>還有和安安（An）在晚上跑到街上亂逛。沒有目的地，就一直走、一直聊天，走到後來乾脆凌晨三點跑去 唐吉軻德。</p>
      <p>明明知道隔天要飛回台灣，卻誰都不想早點睡，好像只要不提明天，時間就會慢一點。</p>
      <p>大阪還是那個大阪，但因為身邊的人不一樣，記憶也跟著不一樣了。</p>
    </div>
  </section>
</div>
