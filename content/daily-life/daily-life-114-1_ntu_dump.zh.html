<div style="display: flex; flex-direction: column; gap: 2rem; align-items: center;">
  <!-- 描述文字 -->
  <div style="margin-bottom: 1rem; width: 100%; max-width: 800px;">
    <p style="font-family: sans-serif; line-height: 1.8; color: #333; font-size: 1.1rem; margin-bottom: 0.5rem;">
      Another semester has passed.
    </p>
    <p style="font-family: sans-serif; line-height: 1.8; color: #333; font-size: 1.1rem; margin-bottom: 0.5rem;">
      I did my best to attend classes,
    </p>
    <p style="font-family: sans-serif; line-height: 1.8; color: #333; font-size: 1.1rem; margin-bottom: 0.5rem;">
      to eat well,
    </p>
    <p style="font-family: sans-serif; line-height: 1.8; color: #333; font-size: 1.1rem;">
      and to record the parts of NTU that I love.
    </p>
  </div>

        <img 
          src="/images/daily-life-114-1_ntu_dump/IMG_2678.jpg"

          class="ntu-slide-img"
          style="width: 600px; height: 450px; object-fit: cover; flex-shrink: 0; display: block;"

          src="/images/daily-life-114-1_ntu_dump/IMG_2763.jpg"

        />
      </div>
      
      <!-- Left arrow button -->
      <button 
        onclick="ntuCarousel1Prev()"
        aria-label="上一張"
        style="position: absolute; left: 8px; top: 50%; transform: translateY(-50%); background-color: #e5e7eb; color: #374151; border-radius: 9999px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); cursor: pointer; z-index: 9999; pointer-events: auto; display: block; border: none; transition: background-color 0.2s;"
        onmouseover="this.style.backgroundColor='#d1d5db'"
        onmouseout="this.style.backgroundColor='#e5e7eb'"
      >
        <svg style="width: 24px; height: 24px; display: block;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      
      <!-- Right arrow button -->
      <button 
        onclick="ntuCarousel1Next()"
        aria-label="下一張"
        style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background-color: #e5e7eb; color: #374151; border-radius: 9999px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); cursor: pointer; z-index: 9999; pointer-events: auto; display: block; border: none; transition: background-color 0.2s;"
        onmouseover="this.style.backgroundColor='#d1d5db'"
        onmouseout="this.style.backgroundColor='#e5e7eb'"
      >
        <svg style="width: 24px; height: 24px; display: block;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
    
    <!-- Dots indicator -->
    <div style="display: flex; justify-content: center; gap: 6px; margin-top: 12px;">
